[project]
name = "webaccessible"
version = "0.1.0"
description = "User-controlled browser guidance backed by Browserbase, EverOS, and Snowflake"
requires-python = ">=3.12,<3.14"
dependencies = [
  "browserbase>=1.15.0,<2",
  "everos-cloud==1.0.0",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "jsonschema>=4.25,<5",
  "playwright>=1.55,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pyyaml>=6.0.2,<7",
  "snowflake-connector-python>=4.0,<5",
  "sse-starlette>=2.4,<3",
  "uvicorn[standard]>=0.35,<1"
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/app/browser/candidate_extractor.py" = ["E501"]
"backend/app/browser/highlighter.py" = ["E501"]
"backend/app/browser/observer.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["snowflake/streamlit"]
