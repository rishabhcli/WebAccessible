app = "webaccessible-care"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  OPERATIONAL_DATABASE_PATH = "/data/webaccessible.sqlite3"
  PORT = "8080"
  # Both are required by the APP_ENV=production validator in backend/app/config.py, and
  # both default to "local". Leaving them unset made Settings() raise at import, so uvicorn
  # died before binding, the machine crash-looped to its restart cap, and the whole site
  # answered nothing. They are configuration rather than credentials, so they belong here.
  BROWSER_EXECUTION_PROVIDER = "browserbase"
  ACTION_PLANNER_PROVIDER = "snowflake_cortex"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    soft_limit = 75
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "webaccessible_data"
  destination = "/data"
